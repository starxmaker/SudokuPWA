<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>Sudoku PWA</title>
    <meta name="theme-color" content="#0b6cff">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7fb;
        color: #0b2135;
        z-index: 9999;
        transition: opacity 180ms ease;
      }
      html.dark #app-splash {
        background: #121212;
        color: #e6eef8;
      }
      #app-splash.app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
      }
      .app-splash__icon {
        width: min(36vw, 144px);
        height: min(36vw, 144px);
      }
      .app-splash__label {
        margin: 0;
        font: 600 1.05rem/1.2 system-ui, Arial, sans-serif;
        letter-spacing: 0.04em;
      }
    </style>
    <!-- Apply saved or system theme before React mounts to avoid flash -->
    <script>
      (function(){
        try {
          const saved = localStorage.getItem('theme')
          if(saved === 'dark') { document.documentElement.classList.add('dark'); return }
          if(saved === 'light') { document.documentElement.classList.remove('dark'); return }
        } catch(e){}
        try {
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          if(prefersDark) document.documentElement.classList.add('dark')
        } catch(e){}
      })();
    </script>

    <!-- In dev, unregister any stale service workers so dev HMR is never intercepted -->
    <script>
      (function(){
        try{
          const host = location.hostname
          const isLocal = host === 'localhost' || host === '127.0.0.1' || host === ''
          if(isLocal && 'serviceWorker' in navigator){
            navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister())).catch(()=>{})
          }
        }catch(e){}
      })();
    </script>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__content">
        <img class="app-splash__icon" src="icons/icon-192.png" alt="" />
        <p class="app-splash__label">Loading...</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
